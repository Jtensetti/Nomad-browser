# Nomad browser integration snapshot lock v2
#
# module  commit  branch  tree
#
# tree is the sha256 of this component's sorted lines in COMPONENTS.sha256,
# so the lock cannot be left behind when the vendored code moves. v1 recorded
# only the commit and nothing checked it: all three entries had gone stale and
# the digest lock passing said nothing about it, because the two files pin
# different things -- COMPONENTS.sha256 pins the bytes that ship, and this
# pins which upstream commit they came from. snapshot_test.go checks it now,
