name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: {go-version: '1.23.x'}
      - name: Verify pinned component snapshots
        run: sha256sum --check --quiet COMPONENTS.sha256
      - name: Verify module snapshot is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod
          test -z "$(git status --porcelain -- go.mod go.sum)"
      - run: go test -race ./...
      - run: go vet ./...
      - name: Scan dependencies for reachable vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: Generate SBOM
        run: ./scripts/generate-sbom.sh sbom.cdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
