name: macOS verification build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Build, sandbox, ad-hoc sign and verify universal DMG
        env:
          NOMAD_VERSION: 0.1.0-alpha.3
          NOMAD_BUILD_NUMBER: ${{ github.run_number }}
        run: bash macos/scripts/build_dmg.sh

      - name: Upload verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nomad-Browser-macOS-verification-${{ github.sha }}
          path: |
            dist/*.dmg
            dist/*.sha256
            dist/effective-entitlements.plist
          if-no-files-found: error
          retention-days: 30
