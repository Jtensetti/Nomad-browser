name: macOS DMG

on:
  push:
    branches: [agent/macos-browser]
    paths:
      - "macos/**"
      - ".github/workflows/macos-dmg.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Build, sandbox, sign and verify universal DMG
        env:
          NOMAD_VERSION: 0.1.0-alpha.1
          NOMAD_BUILD_NUMBER: ${{ github.run_number }}
        run: bash macos/scripts/build_dmg.sh

      - name: Upload immutable workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nomad-Browser-macOS-${{ github.sha }}
          path: |
            dist/*.dmg
            dist/*.sha256
            dist/effective-entitlements.plist
          if-no-files-found: error
          retention-days: 90

      - name: Publish downloadable GitHub prerelease
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short_sha="${GITHUB_SHA:0:8}"
          tag="nomad-browser-macos-${short_sha}"
          gh release create "$tag" dist/*.dmg dist/*.sha256 \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Nomad Browser macOS alpha (${short_sha})" \
            --notes-file macos/RELEASE_NOTES.md
